# Nodebase default configuration
# Override any value via JVM system properties: -Dnodebase.port=9090
# Override the whole file via -Dnodebase.config=/path/to/nodebase.properties

# HTTP listener
host=0.0.0.0
port=8080

# Filesystem
dataDir=./data
storagePath=./storage

# Auth
jwtSecret=change-me-please-this-is-the-default-secret-please-override-in-production
masterKey=change-me-master-key
jwtExpiryMillis=86400000

# Uploads
maxUploadMb=50

# CORS
cors.allowedOrigins=*
